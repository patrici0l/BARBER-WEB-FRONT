<section class="auth-page">
  <div class="auth-card">
    <span class="auth-card__eyebrow">Registro</span>

    <h1>Crear cuenta</h1>

    <p>Regístrate para reservar turnos y recibir futuras notificaciones.</p>

    <!-- Uso del componente Alert para Errores de Registro -->
    <app-alert
      *ngIf="errorMessage"
      type="error"
      [message]="errorMessage"
      (closed)="errorMessage = ''"
    ></app-alert>

    <form class="auth-form" (ngSubmit)="submit()">
      <label>
        Nombre
        <input
          type="text"
          name="name"
          [(ngModel)]="form.name"
          placeholder="Tu nombre"
          autocomplete="name"
          required
        />
      </label>

      <label>
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="form.email"
          placeholder="cliente@email.com"
          autocomplete="email"
          required
        />
      </label>

      <label>
        WhatsApp
        <input
          type="tel"
          name="phoneNumber"
          [(ngModel)]="form.phoneNumber"
          placeholder="+593..."
          autocomplete="tel"
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
          required
        />
      </label>

      <label>
        Confirmar contraseña
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          required
        />
      </label>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="auth-card__footer">
      <span>¿Ya tienes cuenta?</span>
      <a routerLink="/login">Iniciar sesión</a>
    </div>
  </div>
</section>
