<section class="auth-page">
  <div class="auth-card">
    <span class="auth-card__eyebrow">Acceso</span>

    <h1>Iniciar sesión</h1>

    <p>Ingresa con tu cuenta para reservar turnos y consultar tus reservas.</p>

    <!-- Uso del componente Alert para Errores de Login -->
    <app-alert
      *ngIf="errorMessage"
      type="error"
      [message]="errorMessage"
      (closed)="errorMessage = ''"
    ></app-alert>

    <form class="auth-form" (ngSubmit)="submit()">
      <label>
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="form.email"
          placeholder="cliente@email.com"
          autocomplete="email"
          required
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        />
      </label>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="auth-card__footer">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/registro">Crear cuenta</a>
    </div>

    <div class="auth-card__demo">
      <strong>Admin de prueba:</strong>
      <span>admin@barberia.com / admin123</span>
    </div>
  </div>
</section>
