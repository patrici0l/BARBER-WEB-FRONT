<header class="navbar">
  <div class="container navbar__content">
    <a routerLink="/" class="navbar__brand"> Barbería </a>

    <nav class="navbar__links">
      <!-- Enlaces Públicos -->
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>

      <a routerLink="/servicios" routerLinkActive="active"> Servicios </a>

      <a routerLink="/productos" routerLinkActive="active"> Productos </a>

      <!-- Enlaces de Usuario Autenticado -->
      <a *ngIf="isLoggedIn" routerLink="/reservar" routerLinkActive="active"> Reservar </a>

      <a *ngIf="isLoggedIn" routerLink="/mis-reservas" routerLinkActive="active"> Mis reservas </a>

      <!-- Panel de Administración (Solo para Admin) -->
      <ng-container *ngIf="isAdmin">
        <a
          routerLink="/admin"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Admin
        </a>
        <a routerLink="/admin/servicios" routerLinkActive="active"> Admin servicios </a>
        <a routerLink="/admin/productos" routerLinkActive="active"> Admin productos </a>
        <a routerLink="/admin/horarios" routerLinkActive="active"> Admin horarios </a>
        <a routerLink="/admin/notificaciones" routerLinkActive="active"> Notificaciones </a>
      </ng-container>

      <button
        type="button"
        class="navbar__theme"
        [attr.aria-label]="themeService.mode() === 'light' ? 'Activar modo oscuro' : 'Activar modo claro'"
        (click)="toggleTheme()"
      >
        <span class="navbar__theme-track">
          <span class="navbar__theme-thumb"></span>
        </span>
        <span class="navbar__theme-text">
          {{ themeService.mode() === 'light' ? 'Claro' : 'Oscuro' }}
        </span>
      </button>

      <!-- Control de Acceso / Login -->
      <a *ngIf="!isLoggedIn" routerLink="/login" routerLinkActive="active" class="navbar__login">
        Iniciar sesión
      </a>

      <button *ngIf="isLoggedIn" type="button" class="navbar__logout" (click)="logout()">
        Cerrar sesión
      </button>
    </nav>
  </div>
</header>
